<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agência Martinelle — Painel da Equipe</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0f14">
<style>
:root{
  --bg:#0e0f14; --bg2:#161821; --bg3:#1e2130; --line:#2a2e42;
  --tx:#e8eaf2; --tx2:#9aa0b5; --tx3:#6a7088;
  --roxo:#6c63ff; --verde:#43d9ad;
  --grad:linear-gradient(135deg,#6c63ff,#43d9ad);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============ LOGIN ============ */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:320px;text-align:center}
.glogo{width:68px;height:68px;border-radius:19px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;color:#fff;box-shadow:0 10px 40px rgba(108,99,255,.35)}
.gate-card h1{font-size:20px;letter-spacing:.2px}
.gate-card .sub{font-size:13px;color:var(--tx2);margin-top:-12px}
.gate-card input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:13px;font-size:16px;text-align:center;outline:none;transition:.15s}
.gate-card input:focus{border-color:var(--roxo)}
.gate-card input.erro{border-color:#ff5d6c;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gate-card .entrar{width:100%;background:var(--grad);color:#fff;padding:13px;border-radius:11px;font-size:15px;font-weight:700}
.gate-card .entrar:hover{filter:brightness(1.1)}
.gmsg{font-size:12.5px;color:#ff5d6c;min-height:16px}
.gfoot{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--tx3)}

/* ============ HUB ============ */
.hub{display:none;flex-direction:column;height:100%}
body.aberto .hub{display:flex}
body.aberto .gate{display:none}

.topo{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:9px 16px;background:rgba(14,15,20,.97);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.mlogo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex-shrink:0}
.marca b{font-size:14.5px;display:block;white-space:nowrap}
.marca span{font-size:11px;color:var(--tx2);display:block;white-space:nowrap}

.abas{display:flex;gap:5px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 auto}
.abas button{display:flex;align-items:center;gap:7px;padding:8px 17px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--tx2);transition:.15s;white-space:nowrap}
.abas button:hover{color:var(--tx)}
.abas button.on{background:var(--grad);color:#fff;box-shadow:0 3px 12px rgba(108,99,255,.3)}

.acoes{display:flex;gap:4px;align-items:center}
.acoes button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--tx2);border:1px solid transparent}
.acoes button:hover{background:var(--bg3);color:var(--tx);border-color:var(--line)}

.palco{flex:1;position:relative;background:var(--bg)}
.palco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.palco iframe.on{display:block}
.carregando{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--tx2);font-size:13.5px;pointer-events:none;opacity:0;transition:.2s}
.carregando.on{opacity:1}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--roxo);animation:rod .8s linear infinite}
@keyframes rod{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .topo{gap:8px;padding:8px 10px}
  .marca span{display:none}
  .marca b{font-size:13px}
  .abas{order:3;width:100%;margin:0}
  .abas button{flex:1;justify-content:center;padding:8px 6px;font-size:12.5px}
  .acoes{margin-left:auto}
}
</style>
</head>
<body>

<!-- ============ LOGIN ÚNICO DA EQUIPE ============ -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="glogo">M</div>
    <h1>Agência Martinelle</h1>
    <div class="sub">Painel da Equipe — Prospecção · Contratos · Relatórios</div>
    <input type="password" id="senha" placeholder="Senha da equipe" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')entrar()">
    <button class="entrar" onclick="entrar()">Entrar</button>
    <div class="gmsg" id="gmsg"></div>
  </div>
  <div class="gfoot">Tráfego pago e performance · Teresina-PI</div>
</div>

<!-- ============ PAINEL ============ -->
<div class="hub">
  <header class="topo">
    <div class="marca">
      <div class="mlogo">M</div>
      <div><b>Agência Martinelle</b><span>Painel da Equipe</span></div>
    </div>
    <nav class="abas" id="abas"></nav>
    <div class="acoes">
      <button onclick="abrirFora()" title="Abrir esta área em janela própria">↗</button>
      <button onclick="sair()" title="Sair (bloquear o painel)">⏻</button>
    </div>
  </header>
  <main class="palco" id="palco">
    <div class="carregando" id="carregando"><div class="spinner"></div><span>Carregando…</span></div>
  </main>
</div>

<script>
/* ============================================================
   Painel único da Agência Martinelle
   Uma senha → três ferramentas (iframes same-origin).
   A senha gravada em localStorage é a MESMA chave que o
   Prospector, os Contratos e os Relatórios verificam — ou seja,
   login aqui destrava as três ferramentas de uma vez.
============================================================ */
const TEAM_PASSWORD = '28082019';
const AUTH_KEY = 'martinelle_auth';
const TAB_KEY  = 'martinelle_hub_aba';

const FERRAMENTAS = [
  { id:'prospector', icone:'🩺', nome:'Prospecção', src:'prospector-medicos.html', titulo:'Prospecção de Médicos' },
  { id:'contratos',  icone:'📄', nome:'Contratos',  src:'contratos/index.html',    titulo:'Contratos' },
  { id:'relatorios', icone:'📊', nome:'Relatórios', src:'relatorios.html',         titulo:'Relatórios de Tráfego' },
];
const frames = {};
let abaAtiva = null;

const $ = id => document.getElementById(id);

function entrar(){
  const inp = $('senha');
  if(inp.value === TEAM_PASSWORD){
    localStorage.setItem(AUTH_KEY, TEAM_PASSWORD);
    abrirPainel();
  } else {
    $('gmsg').textContent = 'Senha incorreta';
    inp.classList.remove('erro'); void inp.offsetWidth; inp.classList.add('erro');
    inp.select();
  }
}

function abrirPainel(){
  document.body.classList.add('aberto');
  const ultima = localStorage.getItem(TAB_KEY);
  ativar(FERRAMENTAS.some(f=>f.id===ultima) ? ultima : 'prospector');
}

function montarAbas(){
  $('abas').innerHTML = FERRAMENTAS.map(f =>
    `<button id="aba_${f.id}" onclick="ativar('${f.id}')"><span>${f.icone}</span>${f.nome}</button>`).join('');
}

function ativar(id){
  abaAtiva = id;
  localStorage.setItem(TAB_KEY, id);
  const f = FERRAMENTAS.find(x=>x.id===id);
  document.title = `${f.titulo} — Agência Martinelle`;
  FERRAMENTAS.forEach(x => $('aba_'+x.id).classList.toggle('on', x.id===id));
  // cria o iframe na primeira visita à aba; depois só alterna (mantém o estado)
  if(!frames[id]){
    const fr = document.createElement('iframe');
    fr.src = f.src;
    fr.title = f.titulo;
    $('carregando').classList.add('on');
    fr.addEventListener('load', ()=> $('carregando').classList.remove('on'));
    $('palco').appendChild(fr);
    frames[id] = fr;
  }
  Object.entries(frames).forEach(([k,fr]) => fr.classList.toggle('on', k===id));
}

function abrirFora(){
  const f = FERRAMENTAS.find(x=>x.id===abaAtiva);
  if(f) window.open(f.src, '_blank');
}

function sair(){
  if(!confirm('Sair do painel? A equipe precisará digitar a senha de novo neste navegador.')) return;
  localStorage.removeItem(AUTH_KEY);
  location.reload();
}

montarAbas();
if(localStorage.getItem(AUTH_KEY) === TEAM_PASSWORD){
  abrirPainel();
} else {
  setTimeout(()=>$('senha').focus(), 150);
}
</script>
</body>
</html>
