<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Prospecção Médica — Martinelle</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0e0f14; --surface:#171923; --surface2:#1f2230; --surface3:#262a3a;
  --border:#2a2f3f; --border-strong:#3a4054;
  --text:#e8eaf2; --text-soft:#c6cad8; --muted:#8a91a8;
  --accent:#6c63ff; --accent-soft:rgba(108,99,255,.16);
  --green:#43d9ad; --green-soft:rgba(67,217,173,.16);
  --yellow:#f5a623; --yellow-soft:rgba(245,166,35,.16);
  --red:#ef476f; --red-soft:rgba(239,71,111,.16);
  --blue:#4cc9f0; --blue-soft:rgba(76,201,240,.16);
  --pink:#ff6b9d; --pink-soft:rgba(255,107,157,.16);
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow:0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at 20% -20%, rgba(108,99,255,.06), transparent 60%),var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 13px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* =================== HEADER (compacto) =================== */
.header{background:rgba(23,25,35,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px 14px;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.brand{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;letter-spacing:-.3px}
.brand-logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#43d9ad);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;box-shadow:0 3px 10px rgba(108,99,255,.4)}
.header-actions{display:flex;gap:6px;align-items:center}
.btn-cfg{background:var(--surface2);border:1px solid var(--border);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.btn-cfg:hover{border-color:var(--accent);background:var(--surface3)}
.btn-add{background:linear-gradient(135deg,var(--accent),#5b54e8);color:#fff;font-weight:700;padding:7px 14px;border-radius:9px;font-size:13px;box-shadow:0 3px 10px rgba(108,99,255,.35);transition:transform .15s;display:inline-flex;align-items:center;gap:5px;height:32px}
.btn-add:hover{transform:translateY(-1px)}

/* KPI bar — micro */
.kpi-bar{display:flex;flex-wrap:wrap;gap:4px;font-size:11px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;white-space:nowrap;line-height:1.3}
.kpi strong{color:var(--text);font-weight:800;font-size:12px}
.kpi.k-total strong{color:var(--text)}
.kpi.k-today strong{color:var(--yellow)}
.kpi.k-visited strong{color:var(--green)}
.kpi.k-call strong{color:var(--blue)}
.kpi.k-refused strong{color:var(--red)}

/* =================== MAIN TABS (compacto, ícone inline) =================== */
.main-tabs{display:flex;gap:4px;padding:6px 10px 0;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:74px;z-index:49}
.main-tab{flex:1;background:transparent;border:none;padding:8px 6px;font-size:13px;font-weight:700;color:var(--muted);position:relative;transition:color .15s;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.2}
.main-tab:hover{color:var(--text)}
.main-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main-tab .mt-ico{font-size:14px}
.main-tab .mt-count{display:inline-block;background:var(--surface2);color:var(--muted);font-size:10px;padding:1px 6px;border-radius:7px;margin-left:2px;font-weight:800;vertical-align:middle}
.main-tab.active .mt-count{background:var(--accent-soft);color:var(--accent)}

/* =================== SUB-TABS / CHIPS (compacto) =================== */
.subnav{padding:8px 12px 4px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s;white-space:nowrap;position:relative}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 10px rgba(108,99,255,.3)}
.chip.today::after{content:'';position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--yellow);box-shadow:0 0 5px var(--yellow)}
.chip .c-cnt{display:inline-block;background:rgba(0,0,0,.25);padding:0 6px;border-radius:6px;font-size:10px;margin-left:4px;vertical-align:middle}
.chip.active .c-cnt{background:rgba(255,255,255,.22)}

/* =================== SEARCH ROW (compacto) =================== */
.search-row{padding:4px 12px;display:flex;gap:6px;align-items:center}
.search-wrap{flex:1;position:relative}
.search-wrap input{padding:7px 12px 7px 36px;font-size:13px;border-radius:8px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}

/* =================== DAY HEADER (Agenda) =================== */
.day-header{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:14px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.day-header.today{border-color:var(--yellow);background:linear-gradient(135deg,rgba(245,166,35,.12),var(--surface))}
.day-info{flex:1;min-width:200px}
.day-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.day-meta{font-size:12px;color:var(--muted);margin-top:4px}
.day-meta strong{color:var(--text-soft)}
.btn-route{background:linear-gradient(135deg,var(--blue),#3aa8d8);color:#fff;font-weight:700;padding:11px 16px;border-radius:10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(76,201,240,.3);transition:transform .15s}
.btn-route:hover{transform:translateY(-1px)}
.btn-route:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* =================== CONTENT =================== */
.content{padding:0 16px 110px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.section-title .cnt{background:var(--surface2);padding:2px 9px;border-radius:10px;color:var(--text);font-weight:700}

/* =================== CARD =================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px 16px;margin-bottom:10px;position:relative;transition:all .15s;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.card:hover{border-color:var(--border-strong)}
.card.visitar::before{background:var(--accent)}
.card.ligar::before{background:var(--yellow)}
.card.visitado::before{background:var(--green)}
.card.recusou::before{background:var(--red)}
.card.visitado{opacity:.78}
.card.recusou{opacity:.72}
.card.priority::before{background:linear-gradient(180deg,var(--pink),var(--red));width:5px}
.card.priority{border-color:rgba(255,107,157,.3)}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer}
.card-main{flex:1;min-width:0}
.card-name{font-weight:800;font-size:16px;line-height:1.3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-name .pri-flag{font-size:14px;flex-shrink:0}
.card-spec{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-spec .sep{opacity:.4}
.card-time{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 11px;font-weight:800;font-size:14px;text-align:center;min-width:68px;flex-shrink:0;line-height:1.1}
.card-time small{display:block;font-weight:500;color:var(--muted);font-size:10px;margin-top:2px}

.card-info{margin-top:10px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.info-row{display:flex;align-items:flex-start;gap:8px}
.info-row .ico{width:18px;text-align:center;color:var(--muted);flex-shrink:0;font-size:13px;padding-top:1px}
.info-row a{color:var(--blue);font-weight:600}

.obs-box{background:linear-gradient(135deg,rgba(245,166,35,.16),rgba(245,166,35,.06));border:1px solid rgba(245,166,35,.4);border-left:3px solid var(--yellow);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px;color:#ffd592;font-weight:600;line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.obs-box .obs-ico{font-size:14px;flex-shrink:0}

.history-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist-tag{font-size:10.5px;padding:3px 9px;border-radius:7px;font-weight:700;display:inline-flex;align-items:center;gap:4px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.hist-tag.h-day{background:var(--accent-soft);color:#b4adff;border-color:rgba(108,99,255,.25)}
.hist-tag.h-vis{background:var(--green-soft);color:#a4f0d8;border-color:rgba(67,217,173,.25)}
.hist-tag.h-call{background:var(--yellow-soft);color:#ffd592;border-color:rgba(245,166,35,.25)}
.hist-tag.h-hot{background:var(--red-soft);color:#ff9bb3;border-color:rgba(239,71,111,.3)}
.hist-tag.h-pos{background:var(--pink-soft);color:#ffc1d8;border-color:rgba(255,107,157,.3)}
.hist-tag.h-now{background:linear-gradient(135deg,#ef476f,#ff6b9d);color:#fff;border-color:transparent;animation:pulse 1.4s infinite;font-size:11px}
.hist-tag.h-soon{background:linear-gradient(135deg,#f5a623,#ffd592);color:#1a1208;border-color:transparent;font-size:11px}
.hist-tag.h-past{background:var(--surface3);color:var(--muted);border-color:var(--border)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,71,111,.6)}50%{box-shadow:0 0 0 8px rgba(239,71,111,0)}}

/* Card temporal states (agenda do dia) */
.card.ts-now{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 4px 16px rgba(239,71,111,.25)}
.card.ts-now::before{background:linear-gradient(180deg,var(--red),var(--pink));width:5px}
.card.ts-future{border-color:rgba(245,166,35,.3)}
.card.ts-past{opacity:.6}
.card.ts-past .card-time{color:var(--muted)}

.card-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--border)}
.act{padding:7px 11px;border-radius:8px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:5px;line-height:1}
.act:hover{border-color:var(--accent);background:var(--surface3)}
.act-green{background:var(--green-soft);color:var(--green);border-color:rgba(67,217,173,.4)}
.act-blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(76,201,240,.4)}
.act-yellow{background:var(--yellow-soft);color:#ffd592;border-color:rgba(245,166,35,.4)}
.act-red{background:var(--red-soft);color:#ff9bb3;border-color:rgba(239,71,111,.4)}
.act-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.act-icon{padding:7px 9px;min-width:32px;justify-content:center}

/* =================== EMPTY =================== */
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty-ico{font-size:54px;margin-bottom:12px;opacity:.4}
.empty-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}

/* =================== MODAL =================== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;overflow-y:auto}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:480px;padding:22px;margin:auto;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800}
.modal-close{font-size:24px;color:var(--muted);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface2);color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.time-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.time-btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);transition:all .12s}
.time-btn:hover{border-color:var(--accent);color:var(--text)}
.time-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s}
.day-btn:hover{border-color:var(--accent)}
.day-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 10px rgba(108,99,255,.3)}
.pos-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pos-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.pos-btn.on.p-sem{background:var(--pink);color:#fff;border-color:var(--pink)}
.pos-btn.on.p-bas{background:var(--yellow);color:#1a1208;border-color:var(--yellow)}
.pos-btn.on.p-bom{background:var(--green);color:#0a1a14;border-color:var(--green)}
.pos-btn.on.p-desc{background:var(--surface3);color:var(--text);border-color:var(--border-strong)}
.modal-foot{display:flex;gap:8px;margin-top:8px}
.modal-foot button{flex:1;padding:13px;border-radius:11px;font-weight:800;font-size:14px}
.btn-save{background:linear-gradient(135deg,var(--accent),#5b54e8);color:#fff;box-shadow:0 4px 14px rgba(108,99,255,.3)}
.btn-cancel{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-del{background:var(--red-soft);color:var(--red);border:1px solid rgba(239,71,111,.4);flex:0 0 auto;padding:13px 18px}
.stat-mini{font-size:12.5px;color:var(--text-soft);margin-top:10px;padding:11px 13px;background:var(--surface2);border-radius:10px;line-height:1.6;border:1px solid var(--border)}
.cfg-row{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.cfg-row button{padding:13px 14px;border-radius:11px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--border);text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s}
.cfg-row button:hover{border-color:var(--accent);background:var(--surface3)}
.cfg-row .danger{color:var(--red);border-color:rgba(239,71,111,.3)}

/* Move-to-agenda modal */
.move-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

/* Duplicates review */
.dup-modal{max-width:720px}
.dup-group{border:1px solid var(--yellow);border-radius:12px;padding:12px;margin-bottom:14px;background:rgba(245,166,35,.06)}
.dup-group-head{font-size:12px;font-weight:800;color:var(--yellow);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dup-group-actions{display:flex;gap:6px}
.dup-mini-btn{padding:5px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text)}
.dup-mini-btn:hover{border-color:var(--accent)}
.dup-mini-btn.danger{color:var(--red);border-color:rgba(239,71,111,.3)}
.dup-mini-btn.success{color:var(--green);border-color:rgba(67,217,173,.3)}
.dup-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;position:relative;font-size:13px}
.dup-card.best{border-color:var(--green);background:linear-gradient(135deg,rgba(67,217,173,.06),var(--surface))}
.dup-card.best::before{content:'⭐ MAIS COMPLETO';position:absolute;top:-8px;left:10px;background:var(--green);color:#0a1a14;font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.4px}
.dup-name{font-weight:800;font-size:14px;margin-bottom:4px}
.dup-meta{font-size:11.5px;color:var(--muted);line-height:1.5}
.dup-meta strong{color:var(--text-soft)}
.dup-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.dup-act{padding:5px 9px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.dup-act.keep{background:var(--green-soft);color:var(--green);border-color:rgba(67,217,173,.4)}
.dup-act.del{background:var(--red-soft);color:var(--red);border-color:rgba(239,71,111,.4)}
.dup-empty{text-align:center;padding:32px;color:var(--muted)}
.dup-empty-ico{font-size:42px;margin-bottom:8px;opacity:.5}

/* =================== TOAST =================== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface);border:1px solid var(--border);padding:13px 22px;border-radius:13px;font-weight:700;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}

/* =================== SELEÇÃO DE ROTA =================== */
.card-sel-cb{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex-shrink:0;margin-top:2px;align-self:flex-start}
.card.card-selected{border-color:var(--green) !important;background:rgba(67,217,173,.07)}
.card.card-selected::before{background:var(--green) !important}
.sel-fab{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--green);border-radius:16px;padding:12px 20px;display:flex;align-items:center;gap:12px;z-index:150;box-shadow:0 8px 32px rgba(0,0,0,.5);white-space:nowrap;flex-wrap:wrap;justify-content:center}
.sel-fab-btn{background:var(--green);color:#0a1a14;font-weight:800;padding:10px 18px;border-radius:10px;font-size:13px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;transition:transform .15s}
.sel-fab-btn:hover{transform:translateY(-1px)}
.sel-fab-clear{background:var(--surface2);color:var(--muted);border:1px solid var(--border);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.sel-fab-clear:hover{color:var(--text);border-color:var(--border-strong)}

/* =================== FAB =================== */
.fab{position:fixed;bottom:22px;right:22px;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5b54e8);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(108,99,255,.5);z-index:40;display:flex;align-items:center;justify-content:center;font-weight:300;transition:transform .15s}
.fab:hover{transform:scale(1.06)}

@media(max-width:520px){
  .header{padding:7px 12px}
  .main-tab{padding:7px 4px;font-size:12px}
  .main-tab .mt-ico{font-size:13px}
  .main-tab span:not(.mt-ico):not(.mt-count){display:inline}
  .btn-add{padding:6px 10px;font-size:12px;height:30px}
  .btn-add .add-text{display:none}
  .brand{font-size:13px}
  .brand-logo{width:22px;height:22px;font-size:11px}
  .btn-cfg{width:30px;height:30px;font-size:14px}
  .kpi{padding:2px 7px;font-size:10.5px}
  .kpi strong{font-size:11px}
  .card{padding:13px 12px 11px 14px}
  .card-name{font-size:15px}

<!-- =================== HEADER =================== -->
<header class="header">
  <div class="header-top">
    <div class="brand"><span class="brand-logo">M</span> Prospecção Martinelle</div>
    <div class="header-actions">
      <button class="btn-cfg" onclick="openConfig()" title="Configurações">⚙</button>
      <button class="btn-add" onclick="openForm()"><span>+</span><span class="add-text">Médico</span></button>
    </div>
  </div>
  <div class="kpi-bar" id="kpiBar"></div>
</header>

<!-- =================== 3 MAIN TABS =================== -->
<nav class="main-tabs">
  <button class="main-tab" data-view="medicos" onclick="setView('medicos')">
    <span class="mt-ico">🏥</span><span>Médicos</span><span class="mt-count" id="mtcMedicos">0</span>
  </button>
  <button class="main-tab" data-view="agenda" onclick="setView('agenda')">
    <span class="mt-ico">📅</span><span>Agenda</span><span class="mt-count" id="mtcAgenda">0</span>
  </button>
  <button class="main-tab" data-view="ligacao" onclick="setView('ligacao')">
    <span class="mt-ico">📞</span><span>Ligação</span><span class="mt-count" id="mtcLigacao">0</span>
  </button>
</nav>

<!-- =================== SUBNAV =================== -->
<div class="subnav" id="subnav"></div>

<!-- =================== SEARCH =================== -->
<div class="search-row">
  <div class="search-wrap">
    <span class="search-ico">🔍</span>
    <input id="search" placeholder="Buscar nome, especialidade, secretária, endereço..." oninput="render()">
  </div>
</div>

<!-- =================== CONTENT =================== -->
<main class="content" id="content"></main>

<button class="fab" onclick="openForm()" title="Adicionar médico">+</button>

<!-- =================== FORM MODAL =================== -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="formTitle">Novo Médico</div>
      <button class="modal-close" onclick="closeForm()">×</button>
    </div>
    <div class="field"><label>Nome *</label><input id="fName" placeholder="Ex: Dr. João Silva"></div>
    <div class="field-row">
      <div class="field"><label>Especialidade</label><input id="fSpec" placeholder="Ex: Cardiologista"></div>
      <div class="field"><label>Secretária</label><input id="fSec" placeholder="Nome"></div>
    </div>
    <div class="field"><label>Localização / Clínica</label><input id="fAddr" placeholder="Ex: Diamond Center, Sala 1201"></div>
    <div class="field"><label>Telefone</label><input id="fPhone" placeholder="(86) 9XXXX-XXXX" inputmode="tel"></div>
    <div class="field"><label>Dias para visitar</label><div class="days-pick" id="daysPick"></div></div>
    <div class="field">
      <label>Horário <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600">(toque pra preencher)</span></label>
      <input id="fTime" placeholder="Ex: 8h, 14:30" inputmode="numeric">
      <div class="time-pick" id="timePick"></div>
    </div>
    <div class="field"><label>Posicionamento digital</label><div class="pos-pick" id="posPick"></div></div>
    <div class="field"><label>⚠️ Observação importante</label><textarea id="fObs" rows="3" placeholder="Ex: Ligar antes para confirmar, chegar 20min antes, agendar via WhatsApp..."></textarea></div>
    <div class="stat-mini" id="formStats" style="display:none"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeForm()">Cancelar</button>
      <button class="btn-del" id="btnDel" onclick="delDoctor()" style="display:none">🗑</button>
      <button class="btn-save" onclick="saveForm()">Salvar</button>
    </div>
  </div>
</div>

<!-- =================== MOVE TO AGENDA MODAL =================== -->
<div class="overlay" id="moveOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">📅 Agendou visita?</div>
      <button class="modal-close" onclick="closeMove()">×</button>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Defina dia + horário para mover este médico para a Agenda.</p>
    <div class="field"><label>Dias</label><div class="days-pick" id="moveDaysPick"></div></div>
    <div class="field"><label>Horário</label><input id="moveTime" placeholder="Ex: 8h, 14:30"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeMove()">Cancelar</button>
      <button class="btn-save" onclick="confirmMove()">✅ Mover para Agenda</button>
    </div>
  </div>
</div>

<!-- =================== DUPLICATES MODAL =================== -->
<div class="overlay" id="dupOverlay">
  <div class="modal dup-modal">
    <div class="modal-head">
      <div class="modal-title">🔍 Revisar duplicados</div>
      <button class="modal-close" onclick="closeDupReview()">×</button>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px" id="dupHelp"></p>
    <div id="dupContent"></div>
  </div>
</div>

<!-- =================== CONFIG MODAL =================== -->
<div class="overlay" id="cfgOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">⚙ Configurações</div>
      <button class="modal-close" onclick="closeConfig()">×</button>
    </div>
    <div class="cfg-row">
      <button onclick="restoreCarrossel()"><span>📋</span> Restaurar dados do Carrossel (42 médicos)</button>
      <button onclick="openDupReview()"><span>🔍</span> Revisar duplicados (manual)</button>

      <button onclick="exportJSON()"><span>💾</span> Baixar backup (JSON)</button>
      <button onclick="document.getElementById('importFile').click()"><span>📥</span> Importar backup (JSON)</button>

      <button class="danger" onclick="resetAll()"><span>🗑</span> Apagar todos os dados</button>
    </div>
    <div class="stat-mini" id="cfgStats"></div>
  </div>
</div>

  // Fallback: sem dados no localStorage → carrega os 42 médicos do Carrossel
  if(!doctors.length && typeof INITIAL_DOCTORS !== 'undefined'){
    doctors = JSON.parse(JSON.stringify(INITIAL_DOCTORS));
  }
  doctors.forEach(d => {
    d.id = d.id || ('d'+Date.now()+Math.random().toString(36).slice(2,7));
    d.name = d.name || '';
    d.specialty = d.specialty || '';
    d.secretary = d.secretary || '';
    d.address = d.address || d.clinic || '';
    d.phone = d.phone || d.phone1 || d.phone2 || '';
    d.days = Array.isArray(d.days) ? d.days.filter(x => DAYS.includes(x)) : [];
    d.time = d.time || d.arrive || '';
    d.obs = d.obs || d.alert || d.notes || '';
    d.positioning = d.positioning || 'Desconhecido';
    if(!POSITIONS.find(p=>p.v===d.positioning)) d.positioning = 'Desconhecido';
    d.visitCount = d.visitCount || (d.visits||[]).length || 0;
    d.callAttempts = d.callAttempts || 0;
    d.lastVisitDate = d.lastVisitDate || d.visitedAt || '';
    d.lastCallDate = d.lastCallDate || '';
    d.called = !!d.called;
    if(d.status === 'Perdido' || d.status === 'recusou') d.status = 'recusou';
    else if(['Visitado','Fechado','Interessado','Proposta','visitado'].includes(d.status)) d.status = 'visitado';
    else d.status = (d.days.length && d.time) ? 'visitar' : 'ligar';
  });
  dedupeDoctors(true);
  save();
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(doctors));
  localStorage.setItem(LS_VIEW, currentView);
  localStorage.setItem(LS_SUBTAB, JSON.stringify(subTab));
}

function normName(n){
  return String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/\b(dr|dra|doutor|doutora)\.?\s*/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function dedupeDoctors(silent){
  const seen = new Map();
  const kept = [];
  let mergedN = 0;
  doctors.forEach(d => {
    const k = normName(d.name);
    if(!k){ kept.push(d); return; }
    if(seen.has(k)){
      const ex = seen.get(k);
      ['specialty','secretary','address','phone','time','obs'].forEach(f=>{ if(!ex[f] && d[f]) ex[f]=d[f]; });
      ex.days = [...new Set([...(ex.days||[]),...(d.days||[])])];
      ex.visitCount = Math.max(ex.visitCount||0, d.visitCount||0);
      ex.callAttempts = Math.max(ex.callAttempts||0, d.callAttempts||0);
      const posRank = {Sem:3,Básico:2,Bom:1,Desconhecido:0};
      if((posRank[d.positioning]||0) > (posRank[ex.positioning]||0)) ex.positioning = d.positioning;
      const statRank = {visitado:4, recusou:3, visitar:2, ligar:1};
      if((statRank[d.status]||0) > (statRank[ex.status]||0)) ex.status = d.status;
      mergedN++;
    } else { seen.set(k, d); kept.push(d); }
  });
  if(mergedN){
    doctors = kept;
    if(!silent){ save(); render(); toast(`✅ ${mergedN} duplicado(s) mesclado(s)`,'ok'); }
  } else if(!silent){ toast('Nenhum duplicado encontrado','ok'); }
}

function statusOf(d){
  if(d.status === 'visitado') return 'visitado';
  if(d.status === 'recusou') return 'recusou';
  // Regra: precisa de DIA + HORÁRIO para visitar. Sem horário → vai pra Ligação.
  return ((d.days||[]).length && d.time) ? 'visitar' : 'ligar';
}
function isPriority(d){ return d.positioning === 'Sem' && statusOf(d) !== 'visitado' && statusOf(d) !== 'recusou'; }
function todayName(){ return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][new Date().getDay()]; }
function counts(){
  const c = {total:doctors.length, visitar:0, ligar:0, visitado:0, recusou:0, priority:0, today:0};
  const t = todayName();
  doctors.forEach(d => {
    const s = statusOf(d);
    c[s]++;
    if(isPriority(d)) c.priority++;
    if((d.days||[]).includes(t) && s !== 'visitado' && s !== 'recusou') c.today++;
  });
  return c;
}

// RENDER

function render(){
  renderKPI();
  renderMainTabs();
  renderSubnav();
  renderContent();
}

function renderKPI(){
  const c = counts();
  document.getElementById('kpiBar').innerHTML = `
    <span class="kpi k-total">📋 <strong>${c.total}</strong> total</span>
    <span class="kpi k-today">⭐ <strong>${c.today}</strong> hoje</span>
    <span class="kpi"><span style="color:#b4adff">🏃 <strong>${c.visitar}</strong></span> visitar</span>
    <span class="kpi k-call">📞 <strong>${c.ligar}</strong> ligar <span style="opacity:.7">(sem horário)</span></span>
    <span class="kpi k-visited">✓ <strong>${c.visitado}</strong> visitados</span>
    ${c.priority?`<span class="kpi" style="color:#ffc1d8">🎯 <strong>${c.priority}</strong> prioridade</span>`:''}
    ${c.recusou?`<span class="kpi k-refused">🚫 <strong>${c.recusou}</strong> recusou</span>`:''}
  `;
}

function renderMainTabs(){
  const c = counts();
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('active', t.dataset.view === currentView));
  document.getElementById('mtcMedicos').textContent = c.total;
  document.getElementById('mtcAgenda').textContent = c.visitar;
  document.getElementById('mtcLigacao').textContent = c.ligar;
}

function renderSubnav(){
  const sn = document.getElementById('subnav');
  const today = todayName();
  let html = '';
  if(currentView === 'medicos'){
    const cur = subTab.medicos || 'todos';
    const c = counts();
    const chips = [
      {id:'todos', label:'📋 Todos', cnt:c.total},
      {id:'priority', label:'🎯 Prioridade', cnt:c.priority},
      {id:'visitar', label:'🏃 Para visitar', cnt:c.visitar},
      {id:'ligar', label:'📞 Para ligar', cnt:c.ligar},
      {id:'visitado', label:'✅ Visitados', cnt:c.visitado},
      {id:'recusou', label:'🚫 Recusou', cnt:c.recusou},
    ];
    html = chips.map(x => `<button class="chip ${cur===x.id?'active':''}" onclick="setSubTab('${x.id}')">${x.label}<span class="c-cnt">${x.cnt}</span></button>`).join('');
  } else if(currentView === 'agenda'){
    const cur = subTab.agenda || today || 'Terça';
    const dayC = {};
    DAYS.forEach(d => { dayC[d] = doctors.filter(x => statusOf(x)==='visitar' && (x.days||[]).includes(d)).length; });
    html = DAYS.map(d => `<button class="chip ${cur===d?'active':''} ${d===today?'today':''}" onclick="setSubTab('${d}')">${d}${d===today?' ⭐':''}<span class="c-cnt">${dayC[d]}</span></button>`).join('');
  } else if(currentView === 'ligacao'){
    const cur = subTab.ligacao || 'aligar';
    const list = doctors.filter(d => statusOf(d) === 'ligar');
    const aligar = list.filter(d => !d.called).length;
    const ja = list.filter(d => d.called).length;
    const hot = list.filter(d => (d.callAttempts||0) >= 3).length;
    html = `
      <button class="chip ${cur==='aligar'?'active':''}" onclick="setSubTab('aligar')">📞 A ligar<span class="c-cnt">${aligar}</span></button>
      <button class="chip ${cur==='liguei'?'active':''}" onclick="setSubTab('liguei')">✓ Já liguei<span class="c-cnt">${ja}</span></button>
      <button class="chip ${cur==='hot'?'active':''}" onclick="setSubTab('hot')">🔥 Sem retorno<span class="c-cnt">${hot}</span></button>
    `;
  }
  sn.innerHTML = html;
}

function getSubTab(){
  if(currentView === 'medicos') return subTab.medicos || 'todos';
  if(currentView === 'agenda') return subTab.agenda || todayName() || 'Terça';
  if(currentView === 'ligacao') return subTab.ligacao || 'aligar';
}

// SELEÇÃO PARA ROTA
// ============================================================
let selectedIds = new Set();

function toggleDocSel(id, cb){
  if(cb.checked){
    selectedIds.add(id);
    cb.closest('.card').classList.add('card-selected');
  } else {
    selectedIds.delete(id);
    cb.closest('.card').classList.remove('card-selected');
  }
  updateSelFab();
}

function updateSelFab(){
  const fab = document.getElementById('selFab');
  if(!fab) return;
  if(selectedIds.size > 0 && currentView === 'agenda'){
    document.getElementById('selFabCount').textContent = selectedIds.size;
    fab.style.display = 'flex';
  } else {
    fab.style.display = 'none';
  }
}

function clearSel(){
  selectedIds.clear();
  document.querySelectorAll('.card-sel-cb').forEach(cb => cb.checked = false);
  document.querySelectorAll('.card.card-selected').forEach(c => c.classList.remove('card-selected'));
  updateSelFab();
}

function openSelectedRoute(){
  const list = doctors.filter(d => selectedIds.has(d.id) && d.address);
  if(!list.length){ toast('Nenhum médico selecionado tem endereço cadastrado','err'); return; }
  list.sort((a,b) => parseTime(a.time) - parseTime(b.time));
  const url = 'https://www.google.com/maps/dir/' + list.map(d => encodeURIComponent(d.address)).join('/');
  window.open(url, '_blank');
}

function setView(v){
  currentView = v;
  clearSel();
  save(); render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function setSubTab(t){
  subTab[currentView] = t;
  clearSel();
  save(); render();
}

function filterList(){
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const st = getSubTab();
  return doctors.filter(d => {
    if(q){
      const hay = (d.name+' '+d.specialty+' '+d.secretary+' '+d.address+' '+d.phone).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    const s = statusOf(d);
    if(currentView === 'medicos'){
      if(st === 'todos') return true;
      if(st === 'priority') return isPriority(d);
      if(st === 'visitar') return s === 'visitar';
      if(st === 'ligar') return s === 'ligar';
      if(st === 'visitado') return s === 'visitado';
      if(st === 'recusou') return s === 'recusou';
    } else if(currentView === 'agenda'){
      return s === 'visitar' && (d.days||[]).includes(st);
    } else if(currentView === 'ligacao'){
      if(s !== 'ligar') return false;
      if(st === 'aligar') return !d.called;
      if(st === 'liguei') return d.called;
      if(st === 'hot') return (d.callAttempts||0) >= 3;
    }
    return true;
  });
}

function renderContent(){
  const content = document.getElementById('content');
  const list = filterList();

  // Sort: priority first, then by time, then by name
  list.sort((a,b) => {
    const pa = isPriority(a) ? 0 : 1, pb = isPriority(b) ? 0 : 1;
    if(pa !== pb && currentView !== 'agenda') return pa - pb;
    if(a.time && b.time) return parseTime(a.time) - parseTime(b.time);
    if(a.time) return -1;
    if(b.time) return 1;
    return (a.name||'').localeCompare(b.name||'');
  });

  // Agenda: prepend day header
  let prefix = '';
  if(currentView === 'agenda'){
    const day = getSubTab();
    const isToday = day === todayName();
    const dateObj = nextDateFor(day);
    const dateStr = dateObj ? fmtFullDate(dateObj) : '';
    const times = list.map(d => parseTime(d.time)).filter(t => t < 9999).sort((a,b)=>a-b);
    const first = times.length ? fmtMin(times[0]) : '';
    const last = times.length ? fmtMin(times[times.length-1]) : '';
    const mapsList = list.filter(d => d.address).map(d => d.address);
    const routeUrl = mapsList.length ? 'https://www.google.com/maps/dir/' + mapsList.map(a => encodeURIComponent(a)).join('/') : '';
    // Hoje: encontrar próxima visita
    let nextInfo = '';
    if(isToday && times.length){
      const now = nowMinutes();
      const future = times.filter(t => t > now);
      if(future.length){
        const next = future[0];
        const diff = next - now;
        nextInfo = `<div class="day-meta" style="margin-top:4px"><strong style="color:var(--yellow)">⏰ Próxima visita:</strong> ${fmtMin(next)} <span style="color:var(--muted)">(em ${fmtDuration(diff)})</span></div>`;
      } else {
        nextInfo = `<div class="day-meta" style="margin-top:4px;color:var(--green)"><strong>✓ Todas as visitas passaram</strong> — bom trabalho!</div>`;
      }
    }
    prefix = `<div class="day-header ${isToday?'today':''}">
      <div class="day-info">
        <div class="day-title">${isToday?'⭐ HOJE · ':''}${day}-feira${dateStr?` <span style="color:var(--muted);font-weight:600;font-size:13px">· ${dateStr}</span>`:''}</div>
        <div class="day-meta" style="margin-top:4px">
          <strong>${list.length}</strong> médico${list.length!==1?'s':''}
          ${times.length?` · <strong>${first}</strong> → <strong>${last}</strong>`:''}
          · ⏱ ~${fmtDuration(list.length*15)}
          ${list.filter(isPriority).length?` · <span style="color:#ffc1d8">🎯 ${list.filter(isPriority).length} prioridade</span>`:''}
        </div>
        ${nextInfo}
      </div>
      <a class="btn-route" href="${routeUrl}" target="_blank" ${!routeUrl?'onclick="event.preventDefault();toast(\'Adicione endereços para gerar rota\',\'err\')"':''}>🗺 Rota do dia</a>
    </div>`;
  }

  // Ligação: prepend info banner explicando a regra
  if(currentView === 'ligacao'){
    const st = getSubTab();
    const allLigar = doctors.filter(d => statusOf(d) === 'ligar');
    const semHorario = allLigar.filter(d => !d.time).length;
    const semDia = allLigar.filter(d => !(d.days||[]).length).length;
    const subtitle = {
      aligar: 'Ainda não foram contatados — descubra dia/horário e mova pra Agenda.',
      liguei: 'Você ligou mas ainda não conseguiu agendar visita.',
      hot: 'Já tentou 3+ vezes sem resposta — mudar de canal (visita pessoal, WhatsApp, secretária).',
    }[st] || '';
    prefix = `<div class="day-header" style="border-color:var(--yellow);background:linear-gradient(135deg,rgba(245,166,35,.12),var(--surface))">
      <div class="day-info">
        <div class="day-title">📞 Ligação <span style="color:var(--muted);font-weight:600;font-size:13px">— ${list.length} médico${list.length!==1?'s':''}</span></div>
        <div class="day-meta" style="margin-top:6px">
          <strong style="color:#ffd592">⚠️ Regra:</strong> médico sem horário definido vai pra Ligação.
          ${semHorario?` · <strong>${semHorario}</strong> sem horário`:''}
          ${semDia?` · <strong>${semDia}</strong> sem dia`:''}
        </div>
        ${subtitle?`<div class="day-meta" style="margin-top:4px;font-size:11.5px;color:var(--muted)">${subtitle}</div>`:''}
        <div class="day-meta" style="margin-top:6px;font-size:11.5px">
          💡 Quando descobrir o horário → toque em <strong style="color:var(--accent)">📅 Agendar</strong> no card → vai pra Agenda automaticamente.
        </div>
      </div>
    </div>`;
  }

  if(!list.length){
    content.innerHTML = prefix + emptyState();
    return;
  }
  content.innerHTML = prefix + list.map(cardHTML).join('');
}

function parseTime(t){
  if(!t) return 9999;
  const m = String(t).match(/(\d{1,2})\s*[:h]\s*(\d{2})?/i);
  if(m) return parseInt(m[1])*60 + parseInt(m[2]||0);
  return 9999;
}
function fmtMin(m){ const h=Math.floor(m/60), mm=m%60; return mm ? `${h}:${String(mm).padStart(2,'0')}` : `${h}h`; }

// Data próxima ocorrência de um dia da semana ("Terça" → próxima terça)
function nextDateFor(dayName){
  const dayIdx = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].indexOf(dayName);
  if(dayIdx < 0) return null;
  const today = new Date();
  const todayIdx = today.getDay();
  let diff = dayIdx - todayIdx;
  if(diff < 0) diff += 7;
  const d = new Date(today);
  d.setDate(today.getDate() + diff);
  return d;
}
function fmtFullDate(date){
  if(!date) return '';
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${date.getDate()} de ${meses[date.getMonth()]}`;
}
function nowMinutes(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function fmtDuration(min){
  const m = Math.abs(min);
  if(m < 60) return `${m} min`;
  const h = Math.floor(m/60), mm = m%60;
  return mm ? `${h}h ${mm}min` : `${h}h`;
}

function emptyState(){
  const t = getSubTab();
  const map = {
    todos:{ico:'🏥', title:'Nenhum médico cadastrado', sub:'Toque em + para adicionar.'},
    priority:{ico:'🎯', title:'Nenhuma prioridade', sub:'Médicos sem posicionamento digital aparecem aqui.'},
    visitar:{ico:'🏃', title:'Nenhum médico para visitar', sub:'Adicione dia + horário.'},
    ligar:{ico:'📞', title:'Nenhum médico para ligar', sub:'Tudo agendado!'},
    visitado:{ico:'✅', title:'Nenhuma visita registrada', sub:'Marque ✅ Visitei após cada visita.'},
    recusou:{ico:'🎉', title:'Nenhum recusou', sub:'Quando alguém disser não, marque 🚫 Recusou.'},
    aligar:{ico:'📞', title:'Ninguém para ligar', sub:'Todos têm horário definido ou já foram contatados. Aqui ficam os médicos SEM HORÁRIO — você liga para descobrir e move pra Agenda.'},
    liguei:{ico:'✓', title:'Você ainda não ligou para ninguém', sub:'Toque em ✓ Liguei no card depois de cada tentativa.'},
    hot:{ico:'🔥', title:'Nenhum sem retorno', sub:'Aparece aqui quem tem 3+ tentativas sem sucesso.'},
  };
  if(DAYS.includes(t)) return `<div class="empty"><div class="empty-ico">📅</div><div class="empty-title">Nada em ${t}</div><p>Edite um médico e adicione ${t} como dia de visita.</p></div>`;
  const e = map[t] || {ico:'🔍', title:'Nada encontrado', sub:'Tente outra busca.'};
  return `<div class="empty"><div class="empty-ico">${e.ico}</div><div class="empty-title">${e.title}</div><p>${e.sub}</p></div>`;
}

function cardHTML(d){
  const s = statusOf(d);
  const pri = isPriority(d);
  // Status temporal (só relevante na agenda do dia atual)
  let timeStatus = ''; // 'next' | 'now' | 'past' | ''
  if(currentView === 'agenda' && d.time){
    const day = getSubTab();
    if(day === todayName() && s === 'visitar'){
      const t = parseTime(d.time);
      if(t < 9999){
        const now = nowMinutes();
        if(t < now - 30) timeStatus = 'past';
        else if(t <= now + 15 && t >= now - 30) timeStatus = 'now';
        else timeStatus = 'future';
      }
    }
  }
  const cls = s + (pri ? ' priority' : '') + (timeStatus ? ' ts-'+timeStatus : '');
  const dayTags = (d.days||[]).map(x => `<span class="hist-tag h-day">📅 ${esc(x)}</span>`).join('');
  const visTag = d.visitCount ? `<span class="hist-tag h-vis">✓ ${d.visitCount} visita${d.visitCount>1?'s':''}${d.lastVisitDate?' · '+formatDate(d.lastVisitDate):''}</span>` : '';
  const hot = (d.callAttempts||0) >= 3;
  const callTag = d.callAttempts ? `<span class="hist-tag ${hot?'h-hot':'h-call'}">📞 ${d.callAttempts}x${d.lastCallDate?' · '+formatDate(d.lastCallDate):''}</span>` : '';
  const posTag = d.positioning && d.positioning !== 'Desconhecido' ? `<span class="hist-tag ${d.positioning==='Sem'?'h-pos':''}">${d.positioning==='Sem'?'🎯 ':'📊 '}${esc(d.positioning)}</span>` : '';
  // Tag temporal
  let timeTag = '';
  if(timeStatus === 'now') timeTag = '<span class="hist-tag h-now">🔥 AGORA</span>';
  else if(timeStatus === 'future'){
    const t = parseTime(d.time);
    const diff = t - nowMinutes();
    if(diff > 0 && diff < 120) timeTag = `<span class="hist-tag h-soon">⏰ em ${fmtDuration(diff)}</span>`;
  } else if(timeStatus === 'past'){
    timeTag = '<span class="hist-tag h-past">⏱ passou</span>';
  }
  const mapsUrl = d.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.address)}` : '';
  const telUrl = d.phone ? 'tel:'+d.phone.replace(/\D/g,'') : '';
  const waUrl = d.phone ? 'https://wa.me/55'+d.phone.replace(/\D/g,'') : '';
  const timeBlock = d.time
    ? `<div class="card-time"><div>${esc(d.time.split(/[–\-]/)[0].trim())}</div>${(d.time.includes('–')||d.time.includes('-'))?`<small>${esc(d.time)}</small>`:''}</div>`
    : '';

  let actions = '';
  if(s !== 'recusou'){
    if(mapsUrl) actions += `<a class="act act-blue" href="${mapsUrl}" target="_blank" onclick="event.stopPropagation()">🗺 Maps</a>`;
    if(telUrl) actions += `<a class="act act-green" href="${telUrl}" onclick="event.stopPropagation()">📞 Ligar</a>`;
    if(waUrl) actions += `<a class="act" href="${waUrl}" target="_blank" onclick="event.stopPropagation()">💬 WhatsApp</a>`;
    if(s !== 'visitado'){
      actions += `<button class="act act-green" onclick="markVisited('${d.id}');event.stopPropagation()">✅ Visitei</button>`;
      if(s === 'ligar'){
        actions += `<button class="act act-yellow" onclick="addCallAttempt('${d.id}');event.stopPropagation()">+1 ligação</button>`;
        if(d.called){
          actions += `<button class="act" onclick="toggleCalled('${d.id}');event.stopPropagation()">↩ Não atendi</button>`;
        } else {
          actions += `<button class="act act-blue" onclick="toggleCalled('${d.id}');event.stopPropagation()">✓ Liguei</button>`;
        }
        actions += `<button class="act act-primary" onclick="openMove('${d.id}');event.stopPropagation()">📅 Agendar</button>`;
      } else {
        actions += `<button class="act act-yellow" onclick="moveToLigar('${d.id}');event.stopPropagation()">📞 Mover p/ Ligar</button>`;
      }
      actions += `<button class="act act-red" onclick="markRecusou('${d.id}');event.stopPropagation()">🚫 Recusou</button>`;
    } else {
      actions += `<button class="act" onclick="undoVisited('${d.id}');event.stopPropagation()">↩ Desmarcar</button>`;
    }
  } else {
    actions += `<button class="act act-green" onclick="reactivate('${d.id}');event.stopPropagation()">↩ Reativar</button>`;
    if(mapsUrl) actions += `<a class="act act-blue" href="${mapsUrl}" target="_blank" onclick="event.stopPropagation()">🗺</a>`;
    if(telUrl) actions += `<a class="act" href="${telUrl}" onclick="event.stopPropagation()">📞</a>`;
  }

      </div>
      ${timeBlock}
    </div>
    <div class="card-info">
      ${d.address?`<div class="info-row"><span class="ico">📍</span><span>${esc(d.address)}</span></div>`:''}
      ${d.phone?`<div class="info-row"><span class="ico">📞</span><a href="${telUrl}" onclick="event.stopPropagation()">${esc(d.phone)}</a></div>`:''}

// ============================================================
// REVISAR DUPLICADOS — UI manual
// ============================================================
function normPhone(p){ return String(p||'').replace(/\D/g,'').replace(/^55/,''); }
function normAddr(a){
  return String(a||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function nameSimilar(a, b){
  const na = normName(a), nb = normName(b);
  if(!na || !nb) return false;
  if(na === nb) return true;
  // Um é substring do outro com tamanho mínimo
  if(na.length >= 8 && nb.length >= 8){
    if(na.includes(nb) || nb.includes(na)) return true;
  }
  // Mesmas 2+ palavras iniciais
  const pa = na.split(' '), pb = nb.split(' ');
  if(pa.length >= 2 && pb.length >= 2 && pa[0]===pb[0] && pa[1]===pb[1]) return true;
  return false;
}

function findDuplicateGroups(){
  // Cada grupo é uma lista de doctors que se conectam por:
  // - nome similar (substring/2 palavras iniciais)
  // - mesmo telefone (números só)
  // - mesmo endereço normalizado (e não vazio)
  const groups = [];
  const used = new Set();
  for(let i = 0; i < doctors.length; i++){
    if(used.has(doctors[i].id) || doctors[i]._dupIgnore) continue;
    const group = [doctors[i]];
    used.add(doctors[i].id);
    for(let j = i+1; j < doctors.length; j++){
      if(used.has(doctors[j].id) || doctors[j]._dupIgnore) continue;
      const a = doctors[i], b = doctors[j];
      let match = false;
      if(nameSimilar(a.name, b.name)) match = true;
      const pa = normPhone(a.phone), pb = normPhone(b.phone);
      if(!match && pa && pb && pa.length >= 8 && pa === pb) match = true;
      const aa = normAddr(a.address), ab = normAddr(b.address);
      if(!match && aa && ab && aa.length >= 10 && aa === ab && nameSimilar(a.name.split(' ')[0]+' '+a.name.split(' ')[1], b.name.split(' ')[0]+' '+b.name.split(' ')[1])) match = true;
      if(match){ group.push(b); used.add(b.id); }
    }
    if(group.length > 1) groups.push(group);
  }
  return groups;
}

function scoreCard(d){
  let s = 0;
  ['phone','address','clinic','specialty','secretary','time','obs'].forEach(f => { if(d[f]) s++; });
  s += (d.days||[]).length;
  s += (d.visitCount||0) * 2;
  s += (d.callAttempts||0);
  if(d.status === 'visitado') s += 4;
  if(d.status === 'visitar') s += 2;
  return s;
}

  closeConfig();

  document.getElementById('dupOverlay').classList.add('show');
}
function closeDupReview(){ document.getElementById('dupOverlay').classList.remove('show'); }

function renderDupReview(){
  const groups = findDuplicateGroups();
  const help = document.getElementById('dupHelp');
  const content = document.getElementById('dupContent');
  if(!groups.length){
    help.textContent = '';
    content.innerHTML = `<div class="dup-empty">
      <div class="dup-empty-ico">🎉</div>
      <div style="font-weight:800;color:var(--text);margin-bottom:6px">Nenhum duplicado encontrado</div>
      <div style="font-size:13px">Detecta por: nome similar, mesmo telefone, ou mesmo endereço.</div>
    </div>`;
    return;
  }
  help.innerHTML = `Encontrei <strong style="color:var(--yellow)">${groups.length} grupo(s)</strong> com possíveis duplicados. Revise um por um — o registro <strong style="color:var(--green)">⭐ MAIS COMPLETO</strong> é destacado como sugestão.`;
  content.innerHTML = groups.map((g, gi) => {
    const scores = g.map(scoreCard);
    const best = scores.indexOf(Math.max(...scores));
    const reason = detectGroupReason(g);
    return `<div class="dup-group">
      <div class="dup-group-head">
        <span>⚠️ Grupo ${gi+1} · ${reason}</span>
        <div class="dup-group-actions">
          <button class="dup-mini-btn success" onclick="dupMergeGroup(${gi})">🧹 Mesclar tudo no melhor</button>
          <button class="dup-mini-btn" onclick="dupIgnoreGroup(${gi})">✕ Não é duplicado</button>
        </div>
      </div>
      ${g.map((d, di) => `
        <div class="dup-card ${di===best?'best':''}">
          <div class="dup-name">${esc(d.name)}</div>
          <div class="dup-meta">
            <strong>Especialidade:</strong> ${esc(d.specialty||'—')} ·
            <strong>Clínica:</strong> ${esc(d.clinic||'—')}<br>
            <strong>📍</strong> ${esc(d.address||'—')}<br>
            <strong>📞</strong> ${esc(d.phone||'—')} · <strong>👤</strong> ${esc(d.secretary||'—')}<br>
            <strong>📅</strong> ${(d.days||[]).join(', ')||'—'} · <strong>⏰</strong> ${esc(d.time||'—')} ·
            <strong>Status:</strong> ${esc(d.status)} ·
            <strong>Visitas:</strong> ${d.visitCount||0} · <strong>Ligações:</strong> ${d.callAttempts||0}
          </div>
          <div class="dup-actions">
            <button class="dup-act keep" onclick="dupKeepOnly('${d.id}', ${gi})">✓ Manter este, apagar os outros</button>
            <button class="dup-act del" onclick="dupDelete('${d.id}', ${gi})">🗑 Apagar este</button>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('');
}

function detectGroupReason(group){
  const a = group[0], b = group[1];
  if(!b) return 'similar';
  if(normName(a.name) === normName(b.name)) return 'mesmo nome';
  if(normPhone(a.phone) && normPhone(a.phone) === normPhone(b.phone)) return 'mesmo telefone';
  if(normAddr(a.address) && normAddr(a.address) === normAddr(b.address)) return 'mesmo endereço';
  return 'nome similar';
}

// Mantém um doctor, deleta os outros do grupo
function dupKeepOnly(keepId, groupIdx){
  const groups = findDuplicateGroups();
  const group = groups[groupIdx];
  if(!group) return;
  const toDelete = group.filter(d => d.id !== keepId).map(d => d.id);
  if(!confirm(`Apagar ${toDelete.length} registro(s) e manter só o selecionado?`)) return;
  doctors = doctors.filter(d => !toDelete.includes(d.id));
  save(); render(); renderDupReview();
  toast(`✅ ${toDelete.length} duplicado(s) removido(s)`,'ok');
}

// Apaga só este
function dupDelete(id, groupIdx){
  const d = doctors.find(x => x.id === id); if(!d) return;
  if(!confirm(`Apagar ${d.name}?`)) return;
  doctors = doctors.filter(x => x.id !== id);
  save(); render(); renderDupReview();
  toast('🗑 Removido','err');
}

// Mescla tudo no melhor (preserva campos do melhor + completa com outros)
function dupMergeGroup(groupIdx){
  const groups = findDuplicateGroups();
  const group = groups[groupIdx];
  if(!group) return;
  const scores = group.map(scoreCard);
  const best = group[scores.indexOf(Math.max(...scores))];
  if(!confirm(`Mesclar ${group.length} registros em um só (mantendo o mais completo)?`)) return;
  // Mescla campos vazios do best com os outros
  group.forEach(other => {
    if(other.id === best.id) return;
    ['specialty','clinic','address','phone','secretary','time','obs'].forEach(f => {
      if(!best[f] && other[f]) best[f] = other[f];
    });
    const allDays = new Set([...(best.days||[]),...(other.days||[])]);
    best.days = [...allDays];
    best.visitCount = (best.visitCount||0) + (other.visitCount||0);
    best.callAttempts = Math.max(best.callAttempts||0, other.callAttempts||0);
    if(other.lastVisitDate > (best.lastVisitDate||'')) best.lastVisitDate = other.lastVisitDate;
    if(other.lastCallDate > (best.lastCallDate||'')) best.lastCallDate = other.lastCallDate;
    const posRank = {Sem:3,Básico:2,Bom:1,Desconhecido:0};
    if((posRank[other.positioning]||0) > (posRank[best.positioning]||0)) best.positioning = other.positioning;
    const statRank = {visitado:4, recusou:3, visitar:2, ligar:1};
    if((statRank[other.status]||0) > (statRank[best.status]||0)) best.status = other.status;
  });
  // Remove os outros
  const toDelete = group.filter(d => d.id !== best.id).map(d => d.id);
  doctors = doctors.filter(d => !toDelete.includes(d.id));
  save(); render(); renderDupReview();
  toast(`✅ ${toDelete.length} mesclado(s) em ${best.name}`,'ok');
}

// Marca grupo como ignorado (na verdade só re-renderiza — eles não voltam até refazer)
let dupIgnored = new Set();
function dupIgnoreGroup(groupIdx){
  const groups = findDuplicateGroups();
  const group = groups[groupIdx];
  if(!group) return;
  group.forEach(d => dupIgnored.add(d.id));
  // Adiciona marca para não detectar de novo nesta sessão
  group.forEach(d => { d._dupIgnore = true; });
  save();
  renderDupReview();
  toast('✕ Grupo ignorado','ok');
}

function restoreCarrossel(){
  if(typeof INITIAL_DOCTORS === 'undefined'){ toast('Dados do Carrossel não disponíveis','err'); return; }
  const msg = doctors.length
    ? `Restaurar os 42 médicos do Carrossel?\n\nIsso vai MESCLAR com seus ${doctors.length} médicos atuais:\n• Mantém os seus dados (visitas, ligações, status)\n• Adiciona médicos que faltam\n• Preenche campos vazios (telefone, endereço, etc.)`
    : `Carregar os 42 médicos do Carrossel?`;
  if(!confirm(msg)) return;
  // Merge: by normalized name
  const byKey = new Map();
  doctors.forEach(d => byKey.set(normName(d.name), d));
  let added = 0, merged = 0;
  INITIAL_DOCTORS.forEach(src => {
    const k = normName(src.name);
    if(byKey.has(k)){
      const ex = byKey.get(k);
      ['specialty','clinic','address','phone','secretary','obs','time'].forEach(f=>{ if(!ex[f] && src[f]) ex[f]=src[f]; });
      const allDays = new Set([...(ex.days||[]),...(src.days||[])]);
      ex.days = [...allDays];
      if(ex.positioning === 'Desconhecido' && src.positioning !== 'Desconhecido') ex.positioning = src.positioning;
      merged++;
    } else {
      doctors.push(JSON.parse(JSON.stringify(src)));
      added++;
    }
  });
  // Recalcula status para todos
  doctors.forEach(d => {
    if(d.status !== 'visitado' && d.status !== 'recusou'){
      d.status = (d.days.length && d.time) ? 'visitar' : 'ligar';
    }
  });
  save(); render(); closeConfig();
  toast(`✅ ${added} adicionados · ${merged} atualizados`,'ok');
}

// ============================================================
// TOAST

let toastTimer;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show '+(type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

// ============================================================
// CLOSE MODALS
// ============================================================
['formOverlay','cfgOverlay','moveOverlay','dupOverlay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if(e.target === e.currentTarget){
      if(id==='formOverlay') closeForm();
      else if(id==='cfgOverlay') closeConfig();
      else if(id==='moveOverlay') closeMove();
      else if(id==='dupOverlay') closeDupReview();
    }
  });
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeForm(); closeConfig(); closeMove(); closeDupReview(); }
});

// ============================================================
// INIT
// ============================================================
load();
// Set initial agenda subtab to today if applicable
if(!subTab.agenda && DAYS.includes(todayName())) subTab.agenda = todayName();
render();
// Auto-refresh a cada 60s para atualizar "em 1h", "AGORA", "passou"
// Só re-renderiza se estiver na Agenda do dia atual
setInterval(() => {
  if(currentView === 'agenda' && getSubTab() === todayName()){
    renderContent();
    renderKPI();
  }
}, 60000);
</script>
