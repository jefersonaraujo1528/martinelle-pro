<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assinar Contrato — Consultoria MRTN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --text: #f0f0f0;
      --muted: #888;
      --success: #4caf72;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      text-align: center;
    }
    header h1 { font-size: 1rem; color: var(--gold); }
    header p { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .container { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Contrato */
    .contrato-box {
      background: #fff;
      color: #1a1a1a;
      border-radius: 12px;
      padding: 48px 44px;
      margin-bottom: 28px;
      font-size: 0.88rem;
      line-height: 1.75;
    }
    @media (max-width: 600px) { .contrato-box { padding: 28px 20px; } }

    .contrato-box h2 {
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #1a1a1a;
    }
    .contrato-box .subtitulo {
      text-align: center;
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 28px;
    }
    .contrato-box .partes {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 0.84rem;
    }
    .contrato-box .partes strong { color: #1a1a1a; }
    .contrato-box h3 {
      font-size: 0.84rem;
      font-weight: 700;
      margin: 20px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .contrato-box p { margin-bottom: 10px; }
    .contrato-box ul { margin: 8px 0 10px 20px; }
    .contrato-box li { margin-bottom: 4px; }
    .contrato-box .clausula { margin-bottom: 16px; }
    .contrato-box .data-local {
      text-align: right;
      margin-top: 28px;
      margin-bottom: 28px;
      font-size: 0.82rem;
      color: #555;
    }

    /* ===== Controle de quebra de página no PDF =====
       Mantém cada bloco inteiro: nada de título órfão no fim da página
       nem parágrafo cortado no meio. O html2pdf.js respeita estas regras. */
    .contrato-box .clausula,
    .contrato-box .partes,
    .contrato-box .doc-header,
    .contrato-box .assinaturas,
    .contrato-box .data-local,
    .contrato-box ul,
    .contrato-box li {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    /* Título nunca fica sozinho no rodapé — gruda no conteúdo seguinte */
    .contrato-box h2,
    .contrato-box h3 {
      page-break-after: avoid;
      break-after: avoid;
    }

    /* Assinatura */
    .assinar-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      text-align: center;
    }
    .assinar-titulo {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .assinar-instrucao {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .prazo-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.82rem;
      color: var(--gold-light);
      margin-bottom: 20px;
    }
    .btn-assinar {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      padding: 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn-assinar:hover { opacity: 0.9; }
    .btn-assinar:active { transform: scale(0.99); }
    .btn-assinar:disabled { opacity: 0.4; cursor: not-allowed; }
    .gerando-msg { color: var(--muted); font-size: 0.82rem; margin-top: 12px; display: none; }
    .gerando-msg.show { display: block; }
    .spinner-inline {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sucesso */
    .sucesso {
      text-align: center;
      padding: 48px 20px;
      display: none;
    }
    .sucesso-icon { font-size: 4rem; margin-bottom: 16px; }
    .sucesso h2 { font-size: 1.4rem; color: var(--success); margin-bottom: 8px; }
    .sucesso p { font-size: 0.9rem; color: var(--muted); margin-bottom: 24px; }
    .btn-pdf {
      background: var(--gold);
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
    }
    .erro-tela {
      text-align: center;
      padding: 80px 20px;
      color: #e05252;
    }
  </style>
  <!-- html2pdf.js (bundle já inclui html2canvas + jsPDF) — paginação inteligente p/ não cortar texto -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<header>
  <h1>Contrato de Prestação de Serviços</h1>
  <p>Consultoria MRTN — CNPJ 49.561.800/0001-70</p>
</header>

<div class="container">

  <!-- Loading -->
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:0.85rem">Carregando contrato...</p>
  </div>

  <!-- Erro -->
  <div class="erro-tela" id="erroTela" style="display:none">
    <p style="font-size:2rem;margin-bottom:12px">⚠️</p>
    <p>Link inválido ou contrato não encontrado.</p>
  </div>


  <!-- Conteúdo principal -->
  <div id="conteudo" style="display:none">

    <div class="contrato-box" id="contratoBox">
      <!-- Preenchido via JS -->
    </div>

    <div class="assinar-section">
      <div class="assinar-titulo">📄 Contrato pronto</div>
      <p class="assinar-instrucao">
        Confira o contrato acima. Baixe o PDF para enviar ao cliente ou arquivar.
      </p>
      <button class="btn-pdf" id="btnBaixarPdf" onclick="gerarPDF()">⬇️ Baixar PDF do Contrato</button>
    </div>

  </div>
</div>

<script>
  let dadosContrato = null;

  // Parser de dinheiro pt-BR usado no contrato inteiro:
  // "500.00" = decimal com ponto · "4.000,00" = milhar pt-BR
  const _parseBR = s => {
    s = String(s ?? '0').trim().replace(/[R$\s]/g, '');
    if (/^\d+\.\d{1,2}$/.test(s)) return parseFloat(s) || 0;
    return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
  };

  // Ler dados diretamente da URL — sem backend
  function init() {
    const params = new URLSearchParams(location.search);
    const encoded = params.get('d');
    if (!encoded) { mostrarErro(); return; }

    try {
      const b64 = encoded.replace(/-/g, '+').replace(/_/g, '/'); // aceita URL-safe e padrão
      dadosContrato = JSON.parse(decodeURIComponent(escape(atob(b64))));
      renderizarContrato(dadosContrato);
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('conteudo').style.display = 'block';
    } catch(e) {
      mostrarErro();
    }
  }

  function mostrarErro() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('erroTela').style.display = 'block';
  }

  // Renderizar o texto do contrato
  function renderizarContrato(d) {
    // O nome do plano muda conforme o público: médico compra o pacote Pro,
    // negócio local compra Start (1 canal) ou Plus (2 canais).
    const NOMES = {
      medico: { google: 'Google Ads Pro', meta: 'Meta Ads Pro', youtube: 'YouTube Ads Pro' },
      local:  { google: 'Plano Start — Google Ads', meta: 'Plano Start — Meta Ads', plus: 'Plano Plus — Google Ads + Meta Ads' },
    };
    const _pub = ehMedico(d) ? 'medico' : 'local';
    const planos = {};
    Object.entries(NOMES[_pub] || {}).forEach(([k, nome]) => { planos[k] = { nome }; });
    // Helpers financeiros — cartão cobra o VALOR TOTAL (mensal × duração).
    // A CONTRATADA nunca soma juros: o contrato registra total e nº de parcelas.
    const _moeda = _parseBR;
    const _fmt = v => v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const _meses = parseInt(d.duracao || '0') || 0;
    // Valor mensal exibido. Plano com preço ainda em revisão (ex.: YouTube Ads Pro)
    // sai como marcador "[A DEFINIR]" — nunca como zero nem como número inventado.
    const valorMes = _parseBR(d.valor) > 0 ? d.valor : '[A DEFINIR]';
    const _total = _moeda(d.valor) * (_meses > 0 ? _meses : 1);
    const pgtoCartao = () => {
      const raw = d.parcelas || '';                 // '' = cliente escolhe no checkout
      const n = parseInt(raw) || 1;
      // Preço ainda em revisão: não imprime "R$ 0,00" — remete ao valor a definir.
      if (!(_total > 0)) return `cartão de crédito, sobre o valor total do contrato, a ser apurado após a definição expressa do valor mensal pelas Partes`;
      if (raw === '') return `cartão de crédito, no valor total de R$ ${_fmt(_total)}, com o parcelamento a critério do CONTRATANTE no momento do pagamento`;
      if (n <= 1) return `cartão de crédito à vista, no valor total de R$ ${_fmt(_total)}`;
      return `cartão de crédito em até ${n}x sobre o valor total de R$ ${_fmt(_total)}`;
    };
    const pgtoMisto = () => {
      const ent = _moeda(d.entrada), rest = _total - ent;
      const raw = d.parcelasMisto || '';            // '' = cliente escolhe no checkout
      const n = parseInt(raw) || 1;
      const base = `entrada de R$ ${d.entrada} via ${d.formEntrada}`;
      if (!(_total > 0)) return `${base} + restante no cartão sobre o valor total do contrato, a ser apurado após a definição expressa do valor mensal pelas Partes`;
      if (rest <= 0) return `${base} (quita o valor total de R$ ${_fmt(_total)})`;
      if (raw === '') return `${base} + restante de R$ ${_fmt(rest)} no cartão, com o parcelamento a critério do CONTRATANTE (valor total R$ ${_fmt(_total)})`;
      if (n <= 1) return `${base} + restante de R$ ${_fmt(rest)} em 1x no cartão (valor total R$ ${_fmt(_total)})`;
      return `${base} + restante de R$ ${_fmt(rest)} em até ${n}x no cartão (valor total R$ ${_fmt(_total)})`;
    };
    const pgtoTexto = {
      boleto: 'boleto bancário',
      pix: 'PIX (chave: agenciamartinelle@gmail.com)',
      dinheiro: 'dinheiro/espécie, mediante emissão de recibo pelo valor pago',
      cartao: pgtoCartao(),
      misto: pgtoMisto(),
    };
    const plano = planos[d.plano] || { nome: d.plano };
    const dataInicio = formatarData(d.dataInicio);
    const dataFim = calcularFim(d.dataInicio, d.duracao);
    const duracaoTexto = d.duracao === '0' ? 'prazo indeterminado' : `${d.duracao} (${porExtenso(d.duracao)}) meses`;
    const hoje = formatarData(new Date().toISOString().split('T')[0]);
    const numContrato = `MRT-${new Date().getFullYear()}-${Math.floor(Math.random()*9000)+1000}`;

    document.getElementById('contratoBox').innerHTML = `
      <div class="doc-header" style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #c9a84c;padding-bottom:14px;margin-bottom:20px">
        <img src="./logo-martinelle.png" alt="Consultoria MRTN" crossorigin="anonymous" style="height:66px;width:66px;object-fit:contain;flex-shrink:0" />
        <div style="line-height:1.35">
          <div style="font-size:1.15rem;font-weight:800;letter-spacing:0.5px;color:#0d0d0d">CONSULTORIA MRTN</div>
          <div style="font-size:0.72rem;color:#444">CNPJ 49.561.800/0001-70 · Teresina/PI</div>
          <div style="font-size:0.72rem;color:#444">agenciamartinelle@gmail.com · Tráfego pago e performance</div>
        </div>
      </div>
      <h2>Contrato de Prestação de Serviços de Marketing Digital</h2>
      <p class="subtitulo">${plano.nome} · Nº ${numContrato}</p>

      <div class="partes">
        <p><strong>CONTRATANTE:</strong> ${d.nome}, ${d.tipoDoc}: ${d.documento}, e-mail: ${d.email}, telefone: ${d.telefone}, doravante denominado CONTRATANTE.</p>
        <br/>
        <p><strong>CONTRATADA:</strong> <strong>Consultoria MRTN</strong>, inscrita no CNPJ sob o nº 49.561.800/0001-70, com sede em Teresina/PI, representada por Jeferson Araujo Martinelle, doravante denominada CONTRATADA.</p>
      </div>

      <p>Ambas individualmente denominadas "Parte" e, em conjunto, "Partes", têm entre si justo e acertado o presente Contrato de Prestação de Serviços de Marketing Digital, que se regerá pelas cláusulas e condições a seguir.</p>

      <div class="clausula">
        <h3>1. Das Definições</h3>
        <p><strong>1.1</strong> Para os fins deste contrato, considera-se:</p>
        <p>(a) <strong>"Campanha"</strong> — Conjunto de anúncios estruturados, configurados e gerenciados pela CONTRATADA na plataforma ${nomePlataforma(d.plano)}, veiculados a partir do Material Publicitário fornecido e aprovado pelo CONTRATANTE;</p>
        <p>(b) <strong>"Verba de Mídia"</strong> — Valor investido diretamente na plataforma de anúncios pelo CONTRATANTE, distinto e não incluído na taxa de gerenciamento;</p>
        <p>(c) <strong>"Taxa de Gerenciamento"</strong> — Valor mensal pago à CONTRATADA pelos serviços de gestão, estratégia e otimização das campanhas;</p>
        <p>(d) <strong>"Setup Inicial"</strong> — Configuração inicial das campanhas, realizada uma única vez no início do contrato, isenta de cobrança adicional neste pacote;</p>
        <p>(e) <strong>"Relatório"</strong> — Documento mensal com dados de desempenho das campanhas (cliques, impressões, CTR, CPC médio e conversões);</p>
        <p>(f) <strong>"Material Publicitário"</strong> — Textos, imagens, vídeos, áudios, marcas, fotos e demais peças criativas utilizadas nos anúncios, de fornecimento e responsabilidade do CONTRATANTE, cabendo à CONTRATADA a orientação estratégica sobre esse material.</p>
      </div>

      <div class="clausula">
        <h3>2. Do Objeto</h3>
        <p><strong>2.1</strong> O presente contrato tem por objeto a prestação de serviços de <strong>estratégia, estruturação, configuração, gestão e otimização de campanhas de tráfego pago</strong> no âmbito do plano <strong>${plano.nome}</strong>, sendo este documento autossuficiente e não dependente de qualquer anexo ou proposta complementar.</p>
        ${setupPorPlano(d.plano, d.cl_setup, d)}
        ${servicosPorPlano(d.plano, d)}
        <p><strong>2.4 Do Material Publicitário (criativos):</strong> A CONTRATADA <strong>não é produtora de material criativo</strong>. Não estão incluídos neste contrato serviços de design, produção de imagens, gravação ou edição de vídeo, fotografia, produção de conteúdo orgânico ou gestão de redes sociais.</p>
        <p><strong>2.4.1</strong> Cabe à CONTRATADA <strong>orientar e instruir</strong> o CONTRATANTE quanto ao Material Publicitário — formatos, mensagens, ângulos de comunicação, boas práticas das plataformas e adequação às políticas de anúncio — bem como estruturar os anúncios dentro das plataformas a partir do material recebido.</p>
        <p><strong>2.4.2</strong> Cabe ao CONTRATANTE <strong>fornecer o Material Publicitário e aprová-lo por escrito (e-mail ou WhatsApp) antes da veiculação</strong>, respondendo integralmente pela sua veracidade, autoria, licenças de uso, direitos de imagem e conformidade com a legislação aplicável e com as normas do seu órgão de classe.</p>
        <p><strong>2.4.3</strong> A CONTRATADA poderá recusar a veiculação de material que, a seu ver técnico, viole políticas das plataformas de anúncio ou normas aplicáveis, sem que isso configure descumprimento contratual.</p>
        <p><strong>Parágrafo Único:</strong> A Verba de Mídia (investimento direto em anúncios) <strong>NÃO está incluída</strong> na Taxa de Gerenciamento, é de titularidade e custeio exclusivos do CONTRATANTE e deverá ser paga diretamente por ele à plataforma ${nomePlataforma(d.plano)}, sendo recomendado o investimento mínimo de R$ 50,00 (cinquenta reais) por dia. Os dois valores são independentes e jamais se confundem ou se somam.</p>
      </div>

      <div class="clausula">
        <h3>3. Da Inexistência de Exclusividade</h3>
        <p><strong>3.1</strong> A prestação dos serviços objeto deste Contrato não tem caráter de exclusividade, podendo a CONTRATADA prestá-los para outras empresas ou profissionais, inclusive concorrentes do CONTRATANTE, salvo mediante celebração de Termo Aditivo de Exclusividade.</p>
      </div>

      <div class="clausula">
        <h3>4. Das Obrigações e Responsabilidades do Contratante</h3>
        <p><strong>4.1</strong> O CONTRATANTE se obriga a:</p>
        <p><strong>4.1.1</strong> Efetuar o pagamento da Taxa de Gerenciamento nas datas acordadas e manter a Verba de Mídia ativa na plataforma ${nomePlataforma(d.plano)};</p>
        <p><strong>4.1.2</strong> Fornecer à CONTRATADA, sempre que solicitado e no prazo acordado, todas as informações, acessos e aprovações necessárias ao desenvolvimento dos serviços;</p>
        <p><strong>4.1.3</strong> Fornecer o Material Publicitário e <strong>aprová-lo por escrito antes da veiculação</strong>, respondendo perante consumidores, autoridades, CONAR, órgãos de classe e terceiros pela qualidade, autenticidade, veracidade e legalidade das informações divulgadas;</p>
        <p><strong>4.1.4</strong> Fornecer informações verdadeiras, corretas, atuais e completas, mantendo-as sempre atualizadas;</p>
        <p><strong>4.1.5</strong> Resguardar a CONTRATADA de quaisquer demandas judiciais ou administrativas em decorrência do conteúdo das campanhas, assumindo toda a responsabilidade e ônus daí advindos;</p>
        <p><strong>4.2</strong> O CONTRATANTE é o único responsável pelo conteúdo e veracidade das informações contidas nas campanhas, eximindo a CONTRATADA de quaisquer responsabilidades perante terceiros, autoridades reguladoras e órgãos de classe.</p>
      </div>

      <div class="clausula">
        <h3>5. Das Obrigações e Responsabilidades da Contratada</h3>
        <p><strong>5.1</strong> A CONTRATADA se obriga a:</p>
        <p><strong>5.1.1</strong> Executar os serviços descritos na Cláusula 2 com qualidade, técnica e profissionalismo;</p>
        <p><strong>5.1.2</strong> Manter o CONTRATANTE informado sobre o andamento das campanhas por meio de <strong>relatório mensal</strong>, entregue até o 5º dia útil do mês subsequente. Nos <strong>primeiros 60 (sessenta) dias</strong> de vigência, a CONTRATADA enviará adicionalmente um <strong>pulso quinzenal</strong> — comunicação resumida de acompanhamento, sem a formalidade do relatório mensal;</p>
        <p><strong>5.1.3</strong> Manter sigilo absoluto sobre informações confidenciais e dados do CONTRATANTE obtidos em decorrência deste contrato;</p>
        <p><strong>5.1.4</strong> Comunicar ao CONTRATANTE alterações relevantes nas plataformas de anúncio que possam impactar as campanhas.</p>
      </div>

      <div class="clausula">
        <h3>6. Do Prazo e Renovação</h3>
        <p><strong>6.1</strong> O presente contrato vigorará por <strong>${duracaoTexto}</strong>, com início em <strong>${dataInicio}</strong>${d.duracao !== '0' ? ` e término previsto em <strong>${dataFim}</strong>` : ''}, renovando-se automaticamente por <strong>12 (doze) meses</strong>, salvo manifestação contrária de qualquer das partes com antecedência mínima de <strong>${d.cl_aviso || '30'} (${porExtensoNum(d.cl_aviso || '30')}) dias</strong>.</p>
        <p><strong>Prazo mínimo de contratação: ${d.cl_prazoMin || '6'} (${porExtenso(d.cl_prazoMin || '6')}) meses.</strong></p>
        <p><strong>6.2</strong> Na renovação, a CONTRATADA poderá reajustar o valor da Taxa de Gerenciamento, comunicando ao CONTRATANTE com no mínimo ${d.cl_aviso || '30'} (${porExtensoNum(d.cl_aviso || '30')}) dias de antecedência.</p>
      </div>

      <div class="clausula">
        <h3>7. Do Valor e Forma de Pagamento</h3>
        <p><strong>7.1</strong> Pela prestação dos serviços, o CONTRATANTE pagará à CONTRATADA a Taxa de Gerenciamento de <strong>R$ ${valorMes}/mês</strong>, com vencimento no dia <strong>${d.diaVencimento}</strong> de cada mês, mediante <strong>${pgtoTexto[d.pgto] || d.pgto}</strong>. <strong>A Taxa de Gerenciamento remunera exclusivamente os serviços da CONTRATADA e não inclui a Verba de Mídia</strong>, paga pelo CONTRATANTE diretamente à plataforma, conforme Cláusula 2.</p>
        ${totalContratoTexto(d.valor, d.duracao)}
        ${descontoTexto(d.cl_desconto, d.valor)}
        <p><strong>7.2</strong> Caso o contrato se inicie após o dia 1º do mês, o primeiro mês de gerenciamento poderá ser cobrado de forma proporcional (pro rata die) aos dias restantes.</p>

  function descontoTexto(cl, valorCheio) {

    const diaLabel = dia === '1' ? 'primeiro' : dia === '5' ? 'cinco' : dia === '10' ? 'dez' : dia;

        <p>A CONTRATADA desenvolverá uma <strong>Landing Page (página de captura) focada nas campanhas de anúncios</strong> objeto deste contrato, ${tipo} com <strong>prazo de entrega de 30 (trinta) a 45 (quarenta e cinco) dias</strong> a contar do início do contrato e do fornecimento, pelo CONTRATANTE, das informações e materiais necessários.</p>
        <p><strong>Parágrafo Único:</strong> O <strong>domínio</strong> (endereço do site) e a <strong>hospedagem</strong> da Landing Page são de <strong>responsabilidade e custeio exclusivos do CONTRATANTE</strong>. A CONTRATADA prestará a orientação técnica necessária à contratação, não respondendo, porém, pelos custos de domínio e hospedagem.</p>
      </div>`;
  }

  // Gerar PDF do contrato (papel timbrado + nomes de assinatura já no documento)
  async function gerarPDF() {
    const btn = document.getElementById('btnBaixarPdf');
    const orig = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Gerando PDF...'; }
    try {
      const contratoEl = document.getElementById('contratoBox');
      // Nome do arquivo: contrato-nome-do-cliente.pdf (sem acentos/s\u00edmbolos)
      const slug = (dadosContrato?.nome || 'cliente')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // remove acentos
        .trim().toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); // vira kebab-case
      const nomeArquivo = `contrato-${slug || 'cliente'}.pdf`;

      const opt = {
        // margens em mm: [topo, esquerda, base, direita] \u2014 padr\u00e3o documento formal
        margin:      [14, 14, 16, 14],
        filename:    nomeArquivo,
        image:       { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', letterRendering: true, scrollY: 0 },
        jsPDF:       { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
        // avoid-all + css = respeita os page-break-inside:avoid das cl\u00e1usulas
        pagebreak:   { mode: ['avoid-all', 'css', 'legacy'] },
      };

      // Gera o PDF e, antes de salvar, carimba o rodap\u00e9 com pagina\u00e7\u00e3o em todas as p\u00e1ginas.
      const worker = html2pdf().set(opt).from(contratoEl).toPdf();
      await worker.get('pdf').then((pdf) => {
        const total = pdf.internal.getNumberOfPages();
        const w = pdf.internal.pageSize.getWidth();
        const h = pdf.internal.pageSize.getHeight();
        for (let i = 1; i <= total; i++) {
          pdf.setPage(i);
          pdf.setFontSize(8);
          pdf.setTextColor(130);
          pdf.text('Consultoria MRTN \u00b7 CNPJ 49.561.800/0001-70', 14, h - 7);
          pdf.text(`P\u00e1gina ${i} de ${total}`, w - 14, h - 7, { align: 'right' });
        }
      });
      await worker.save();
    } catch (e) {
      console.error(e);
      alert('Erro ao gerar PDF. Tente novamente ou tire um print do contrato.');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = orig || '\u2b07\ufe0f Baixar PDF do Contrato'; }
    }
  }

  init();
</script>
