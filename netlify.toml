[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-optional"

[[redirects]]
  from = "/"
  to = "/prospector-medicos.html"
  status = 200

[[redirects]]
  from = "/api/asaas"
  to = "/.netlify/functions/asaas"
  status = 200

[[redirects]]
  from = "/api/autentique"
  to = "/.netlify/functions/autentique-sign"
  status = 200

# Não cachear HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
