[build]
  publish = "."
  functions = "_functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/"
  to = "/prospector-medicos.html"
  status = 200

[[redirects]]
  from = "/api/asaas"
  to = "/.netlify/functions/asaas"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
