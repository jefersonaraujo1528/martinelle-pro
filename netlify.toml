[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/prospector-medicos.html"
  status = 200

[[redirects]]
  from = "/api/telegram"
  to = "/.netlify/functions/telegram-webhook"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/update-doctors"
  status = 200
