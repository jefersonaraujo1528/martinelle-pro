[build]
  publish = "."

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/prospector-medicos.html"
  status = 200

[[redirects]]
  from = "/api/autentique-proxy"
  to = "/.netlify/functions/autentique-proxy"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
